# 未灵（Weiling）品牌变体打包配置（BRAND=fundet 构建时使用）。
# 0.3.0 起：展示名「未灵」（快捷方式/窗口/应用内），productName 用 ASCII
# 「Weiling」保证安装目录无中文；appId/GitHub 仓（xiaosen6/fundet）保留
# fundet 技术标识——卸载升级身份与更新通道连续；userData 由 main/index.ts
# 钉死 %APPDATA%\Fundet（存量数据零迁移）。
appId: com.fundet.app
productName: Weiling
directories:
  output: dist
  buildResources: resources

publish:
  provider: github
  owner: xiaosen6
  repo: fundet
  releaseType: release

npmRebuild: false

files:
  - out/**
  - drizzle/**
  - package.json
  # agent-core/shared 打进主 bundle，不进 asar；browser-runtime 的运行时闭包
  # （playwright-core/sharp/…，101 包）由 tools/pack-browser-deps.mjs 打平，
  # 经下方 extraResources 落到 resources/node_modules（asar 外，主进程模块
  # 解析向上可及；.node 原生二进制不进 asar 也免去 asarUnpack）
  - "!node_modules/@fundet/agent-core"
  - "!node_modules/@fundet/shared"

asarUnpack:
  - "**/*.node"

extraResources:
  - from: resources/fundet/icon.png
    to: icon.png
  - from: resources/fundet/icon.ico
    to: icon.ico
  - from: resources-browser/node_modules
    to: node_modules
  - from: ../../apps/cua-driver-bin/win32-x64
    to: cua-driver/win32-x64
    filter:
      - '**/*'

linux:
  category: Utility
  icon: resources/fundet/icon.png

win:
  icon: resources/fundet/icon.ico
  target:
    - nsis
  extraResources:
    - from: ../../apps/pi-bin/win32-x64
      to: pi/win32-x64
    - from: ../../apps/ripgrep-bin/win32-x64
      to: ripgrep-bin/win32-x64
    - from: ../../apps/cua-driver-bin/win32-x64
      to: cua-driver/win32-x64

nsis:
  include: build/installer.nsh
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: 未灵
  artifactName: Weiling-Setup-${version}-${arch}.exe

mac:
  icon: resources/fundet/icon.png
  category: public.app-category.developer-tools
  identity: null
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  extraResources:
    - from: ../../apps/pi-bin/darwin-${arch}
      to: pi/darwin-${arch}
    - from: ../../apps/ripgrep-bin/darwin-${arch}
      to: ripgrep-bin/darwin-${arch}
    - from: ../../apps/cua-driver-bin/darwin-universal
      to: cua-driver/darwin-universal

dmg:
  artifactName: Fundet-${version}-${arch}.dmg
  backgroundColor: "#f5f5f5"
