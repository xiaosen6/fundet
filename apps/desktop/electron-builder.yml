# Fundet 品牌变体打包配置（BRAND=fundet 构建时使用）。
# 与 electron-builder.yml 唯一差别：productName / 图标 / 发布仓（xiaosen6/fundet）。
# 功能与 LongMa 完全一致；userData 自动隔离到 %APPDATA%\Fundet。
# （0.3.0 曾改「未灵」一日，09-21 用户拍板回退 Fundet 全部展示名与打包名。）
appId: com.fundet.app
productName: Fundet
afterPack: build/after-pack.cjs
directories:
  output: dist
  buildResources: resources

publish:
  provider: github
  owner: xiaosen6
  repo: fundet
  releaseType: release

npmRebuild: false

files:
  - out/**
  - drizzle/**
  - package.json
  # agent-core/shared 打进主 bundle，不进 asar；browser-runtime 的运行时闭包
  # （playwright-core/sharp/…）由 tools/pack-browser-deps.mjs 打平+裁剪后，
  # 以 files 条目并入 app.asar 内的 node_modules（2026-09-29 spike 实证：
  # Electron 37 主进程 ESM 可从 asar 解析 node_modules 裸包/子目录/exports map，
  # 五项全绿）。asar 单文件落盘替代散装 5,600+ 文件——安装成本由「文件数 ×
  # 每文件固定开销（实测 5,622 小文件 11.3s vs 单大文件 93ms）」塌缩到常数；
  # 原生二进制走 asarUnpack（@img 带非 .node 的 dll）。
  - "!node_modules/@fundet/agent-core"
  - "!node_modules/@fundet/shared"
  - from: resources-browser/node_modules
    to: node_modules

asarUnpack:
  - "**/*.node"
  - "**/node_modules/@img/**"

# Chromium 语言包只留中英（默认 55 个 locale 文件 43MB）
electronLanguages:
  - zh-CN
  - en-US

extraResources:
  - from: resources/fundet/icon.png
    to: icon.png
  - from: resources/fundet/icon.ico
    to: icon.ico

linux:
  category: Utility
  icon: resources/fundet/icon.png

win:
  icon: resources/fundet/icon.ico
  # 关掉 eb 的 signtool 版本资源编辑（图标/版本资源由 afterPack 钩子的 rcedit 补——只处理主 exe，无全目录锁风暴）：
  # 它逐个锁 exe，与 extraResources 拷贝重试竞态，慢日确定性 EBUSY（2026-09-25
  # 四连挂根因）；更新链不依赖 exe 资源段（走 latest.yml）。
  signAndEditExecutable: false
  target:
    - nsis
  extraResources:
    - from: ../../apps/pi-bin/win32-x64
      to: pi/win32-x64
    - from: ../../apps/ripgrep-bin/win32-x64
      to: ripgrep-bin/win32-x64
    # cua-driver 改由 afterPack 钩子带重试拷贝（Defender 扫描锁窗，eb 裸拷四连 EBUSY）
    # git 以单文件 tar.gz 随包（安装期免 2500+ 文件写盘/杀软扫描），首启由
    # 主进程解到 userData/runtime/git——见 host/git-bash.ts
    - from: ../../apps/git-bin/win32-x64-runtime.tar.gz
      to: runtime/git.tar.gz
    - from: ../../apps/git-bin/win32-x64/VERSION
      to: runtime/git.version

nsis:
  include: build/installer.nsh
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: Fundet
  artifactName: Fundet-Setup-${version}-${arch}.exe

mac:
  # mac 要求 ≥512px（256 的 icon.png 会被 electron-builder 拒绝：CI mac job 曾恒红于此）
  icon: resources/fundet/icon-512.png
  category: public.app-category.developer-tools
  identity: null
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  extraResources:
    - from: ../../apps/pi-bin/darwin-${arch}
      to: pi/darwin-${arch}
    - from: ../../apps/ripgrep-bin/darwin-${arch}
      to: ripgrep-bin/darwin-${arch}
    - from: ../../apps/cua-driver-bin/darwin-universal
      to: cua-driver/darwin-universal

dmg:
  artifactName: Fundet-${version}-${arch}.dmg
  backgroundColor: "#f5f5f5"
